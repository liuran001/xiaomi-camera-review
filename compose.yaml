name: xiaomi-review
x-common: &common
  image: xiaomi-review:1.0.0
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=128m,mode=1777
  environment:
    APP_PASSWORD: "${APP_PASSWORD:?Run python tools/init_config.py first}"
    SESSION_SECRET: "${SESSION_SECRET:?Run python tools/init_config.py first}"
    COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    RECORDINGS_ROOT: /recordings
    DATA_ROOT: /data
    MODEL_ROOT: /models
    SOURCE_TZ: "${SOURCE_TZ:-Asia/Shanghai}"
    STABLE_SECONDS: "${STABLE_SECONDS:-180}"
    COMPLETE_FILE_BYTES: "${COMPLETE_FILE_BYTES:-0}"
    SAMPLE_SECONDS: "${SAMPLE_SECONDS:-3}"
    EMPTY_SCENE_GATE: "${EMPTY_SCENE_GATE:-0}"
    ANALYSIS_CHUNK_SECONDS: "${ANALYSIS_CHUNK_SECONDS:-60}"
    SCAN_SECONDS: "${SCAN_SECONDS:-45}"
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    OPENCV_NUM_THREADS: "${OPENCV_NUM_THREADS:-1}"
    PREVIEW_THREADS: "${PREVIEW_THREADS:-1}"
    MALLOC_ARENA_MAX: "2"
  volumes:
    - type: bind
      source: "${RECORDINGS_PATH:?Set RECORDINGS_PATH in .env}"
      target: /recordings
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./data
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ./models
      target: /models
      read_only: true
      bind:
        create_host_path: false
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *common
    build: .
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  worker:
    <<: *common
    # web builds the shared image once; avoid parallel exports to the same tag.
    pull_policy: never
    mem_limit: 768m
    memswap_limit: 768m
    command: ["nice", "-n", "15", "python", "-m", "camera_review.worker"]
